<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le plus beau des vols">
<meta name="theme-color" content="#2b2140">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<title>Le plus beau des vols</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>html { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }</style>
</head>
<body>
<!-- BODY:START -->
<div id="app">
  <canvas id="game" aria-label="Zone de jeu"></canvas>
  <button id="btn-home" hidden>Menu</button>

  <section id="menu" class="overlay">
    <h1 id="title">Le plus beau des vols</h1>
    <h2>Choisis ton personnage</h2>
    <div id="char-list" class="picker"></div>
    <h2>Avec qui tu joues ?</h2>
    <div id="friend-list" class="picker"></div>
    <h2>Choisis ton niveau</h2>
    <div id="level-list" class="picker"></div>
    <p id="candy-total" class="tag"></p>
    <div class="row">
      <button id="btn-play" class="big">Jouer</button>
      <button id="btn-house" class="big alt">Ma maison</button>
    </div>
    <button id="btn-sound" class="pill">Son : oui</button>
  </section>

  <section id="end" class="overlay" hidden>
    <h1 id="end-title">Oups !</h1>
    <div class="card">
      <p id="end-score"></p>
      <p id="end-candies"></p>
      <p id="end-best"></p>
    </div>
    <div class="row">
      <button id="btn-next" class="big">Niveau suivant</button>
      <button id="btn-retry" class="pill">Rejouer</button>
      <button id="btn-menu" class="pill">Menu</button>
    </div>
  </section>

  <section id="house" class="screen" hidden>
    <header class="bar">
      <button id="house-out" class="pill">Menu</button>
      <h2>Ma maison à New York</h2>
    </header>
    <nav id="house-tabs" class="tabs"></nav>
    <div class="house-stage"><canvas id="house-canvas" aria-label="Ma maison"></canvas></div>
    <div id="house-drawer" class="drawer"></div>
  </section>

  <section id="creator" class="screen" hidden>
    <header class="bar">
      <button id="cr-back" class="pill">Retour</button>
      <h2>Crée ton personnage</h2>
    </header>
    <div class="cr-body">
      <canvas id="cr-preview" aria-label="Ton personnage"></canvas>
      <div class="cr-panel">
        <div class="cr-row">
          <h3>Son prénom</h3>
          <input id="cr-name" class="name-input" maxlength="14" autocomplete="off">
        </div>
        <nav id="cr-tabs" class="tabs"></nav>
        <div id="cr-options"></div>
        <button id="cr-done" class="big">C’est fini !</button>
      </div>
    </div>
  </section>
</div>
<!-- BODY:END -->
<script type="module" src="src/main.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
